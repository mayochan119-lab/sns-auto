theme: luna
backgrounds: [images/renai/backgrounds/bg1.jpg, images/renai/backgrounds/bg2.jpg]
seed: 13
slides:
  - type: cover
    title: "11月、\n恋が**動きやすい**\n**5つの**タイミング"
    title_size: 92
    subtitle: "保存用カレンダー"

  - type: text
    icon: moon
    heading: "本題の前に…"
    divider: false
    body: "いま想っている彼のことを\nひとり思い浮かべてみてね\n\n彼と過ごす11月を想像しながら\n**ゆっくり読み進めてください**"

  - type: text
    eyebrow: "一粒万倍日"
    heading: "**始めたこと**が\n育ちやすい日"
    body: "11/7・11/8・11/19は\n**自分から一歩**踏み出す日に\n\n11/4・11/20は不成就日と\n重なるので**整える日**に"

  - type: text
    eyebrow: "11/7 立冬"
    heading: "**冬のはじまり**に\n声をかける日"
    body: "「寒くなってきたね」は\n連絡のきっかけにぴったり\n\n一粒万倍日とも重なるので\n**ごはんのお誘い**をひとつ"

  - type: text
    eyebrow: "11/9 蠍座の新月"
    heading: "**なりたい関係**を\n書き出す日"
    body: "16:02の新月のあとに\n彼とどうなりたいかを\nノートに書き出してみて\n蠍座の新月は**深い想い**と\n向き合うのにいい夜です"

  - type: text
    eyebrow: "11/14 W逆行が終わる"
    heading: "**止まっていた恋**が\n動き出しやすい日"
    body: "金星と水星の逆行が\nそろって終わる日\n\n迷っていたひとことを\n**送るきっかけ**にしてみて"

  - type: text
    eyebrow: "11/24 双子座の満月"
    heading: "**素直なひとこと**を\n届ける夜"
    body: "23:54に満ちる月は\n大きく見えるスーパームーン\n\n言葉の星座・双子座の夜に\n**今の気持ち**を伝えてみて"

  - type: list
    eyebrow: "保存用"
    heading: "**11月の恋カレンダー**"
    style: dot
    items:
      - "==11/4==　身だしなみを整える"
      - "==11/7==　ごはんに誘ってみる"
      - "==11/8==　自分からひとこと"
      - "==11/9==　なりたい関係を書く"
      - "==11/14==　迷っていた連絡を送る"
      - "==11/19==　新しいことを始める"
      - "==11/20==　部屋を整える"
      - "==11/24==　気持ちを言葉に"

  - type: closing
