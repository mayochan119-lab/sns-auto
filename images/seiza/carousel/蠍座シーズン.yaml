theme: rei
seed: 5
slides:
  - type: cover
    eyebrow: "10/23〜11/22"
    title: "蠍座シーズンに\n深まること"
    subtitle: "12星座別｜おすすめの過ごし方"
    art: wheel
    art_size: 340
    note: "自分と大切な人の星座をチェックしてね"

  - type: text
    eyebrow: "蠍座シーズンってなに？"
    heading: "太陽が蠍座を進む\n深まりの季節"
    body: "10/23〜11/22の約1か月。\n太陽が蠍座を通るこの時期は\n**深さ・本音・絆**がテーマ。\n\n10/24からはW逆行も重なり\n広げるより**深める**ほうが\nうまく流れやすい時期です。"

  - type: text
    icon: star
    eyebrow: "蠍座シーズンに深まること"
    heading: "牡羊座・牡牛座"
    sections:
      - label: "牡羊座｜信頼の絆"
        text: "大切な人との絆が深まるとき。\n**本音をひとつ**打ち明けると\n距離がぐっと近づきます。"
      - label: "牡牛座｜パートナー"
        text: "向き合う相手との関係が深まるとき。\n**最後まで話を聞く**ことで\n信頼がいっそう育ちます。"

  - type: text
    icon: star
    eyebrow: "蠍座シーズンに深まること"
    heading: "双子座・蟹座"
    sections:
      - label: "双子座｜毎日の習慣"
        text: "暮らしの土台が深まるとき。\n**眠りと朝の時間**を整えると\n心も体も軽くなっていきます。"
      - label: "蟹座｜恋とときめき"
        text: "好きなものへの想いが深まるとき。\n恋も趣味も**心が動くほう**へ。\n楽しむほど魅力が増します。"

  - type: text
    icon: star
    eyebrow: "蠍座シーズンに深まること"
    heading: "獅子座・乙女座"
    sections:
      - label: "獅子座｜心の居場所"
        text: "家で過ごす時間が深まるとき。\n**部屋を整えて**ゆっくり休むと\n次へ進む力がたまります。"
      - label: "乙女座｜ことばと学び"
        text: "身近な人との会話が深まるとき。\n**途中だった本や勉強**を\n再開するのにもいい時期です。"

  - type: text
    icon: star
    eyebrow: "蠍座シーズンに深まること"
    heading: "天秤座・蠍座"
    sections:
      - label: "天秤座｜お金と価値観"
        text: "自分の価値観がはっきりするとき。\n**本当に好きなもの**を選ぶと\n心が満たされていきます。"
      - label: "蠍座｜あなたらしさ"
        text: "誕生日シーズン、あなたの魅力が\nいちばん深く輝くとき。\n**やりたいこと**を書き出してみて。"

  - type: text
    icon: star
    eyebrow: "蠍座シーズンに深まること"
    heading: "射手座・山羊座"
    sections:
      - label: "射手座｜ひとり時間"
        text: "自分の内側との対話が深まるとき。\n**ひとりの時間**を大切にすると\n次の誕生日シーズンが輝きます。"
      - label: "山羊座｜仲間との縁"
        text: "信頼できる仲間との縁が深まるとき。\n**未来の話**ができる人と\n会う時間をつくってみて。"

  - type: text
    icon: star
    eyebrow: "蠍座シーズンに深まること"
    heading: "水瓶座・魚座"
    sections:
      - label: "水瓶座｜仕事と目標"
        text: "仕事への向き合い方が深まるとき。\n**ひとつのことに集中**すると\n努力が形になりやすい時期です。"
      - label: "魚座｜学びと視野"
        text: "知りたい気持ちが深まるとき。\n**行ってみたい場所**や学びに\nふれると心が広がります。"

  - type: closing
