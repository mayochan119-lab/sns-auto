theme: rei
seed: 11
slides:
  - type: cover
    eyebrow: "12星座別"
    title: "本当はさみしい\nときのサイン"
    subtitle: "強がりの奥にある気持ち"
    art: wheel
    art_size: 320
    note: "大切な人の星座もチェックしてね"

  - type: text
    icon: heart
    eyebrow: "本当はさみしいときのサイン"
    heading: "牡羊座・牡牛座"
    sections:
      - label: "牡羊座｜強がりが増える"
        text: "「ひとりで平気」が増えたら\n本当はかまってほしいとき。\n**こちらから声をかけて**あげて。"
      - label: "牡牛座｜おうちにこもる"
        text: "好きなものを食べて家にこもるのは\n心がさみしいサイン。\n**ごはんに誘う**のがいちばんです。"

  - type: text
    icon: heart
    eyebrow: "本当はさみしいときのサイン"
    heading: "双子座・蟹座"
    sections:
      - label: "双子座｜連絡が急に増える"
        text: "何気ない話を何度も送るのは\n**話し相手がほしい**サイン。\nスタンプひとつでもほっとします。"
      - label: "蟹座｜人の心配ばかりする"
        text: "「大丈夫？」と気づかうのは\n自分も気にかけてほしいから。\n**「あなたは？」**と聞き返してあげて。"

  - type: text
    icon: heart
    eyebrow: "本当はさみしいときのサイン"
    heading: "獅子座・乙女座"
    sections:
      - label: "獅子座｜いつも以上に明るい"
        text: "にぎやかにふるまうほど\n心は少しさみしいのかも。\n**がんばりに気づいて**伝えてあげて。"
      - label: "乙女座｜黙々と没頭する"
        text: "片づけや仕事に打ちこむのは\nさみしさをまぎらわせたいから。\n**「ありがとう」**のひと言が支えに。"

  - type: text
    icon: heart
    eyebrow: "本当はさみしいときのサイン"
    heading: "天秤座・蠍座"
    sections:
      - label: "天秤座｜予定を詰めこむ"
        text: "人と会い続けて笑っていても\nひとりになると、ふとさみしい。\n**ふたりきりの時間**をつくってあげて。"
      - label: "蠍座｜返信がそっけない"
        text: "短い返事で気持ちを隠すときほど\n本当はそばにいてほしいとき。\n**いつも通りの連絡**が安心になります。"

  - type: text
    icon: heart
    eyebrow: "本当はさみしいときのサイン"
    heading: "射手座・山羊座"
    sections:
      - label: "射手座｜遠くへ行きたがる"
        text: "旅や遠出の話が増えたら\nさみしさを感じているサイン。\n**「一緒に行こう」**と言ってみて。"
      - label: "山羊座｜弱音をはかない"
        text: "忙しくして弱音を見せないのは\nひとりで抱えこんでいるサイン。\n**温かい飲みもの**をそっと差し入れて。"

  - type: text
    icon: heart
    eyebrow: "本当はさみしいときのサイン"
    heading: "水瓶座・魚座"
    sections:
      - label: "水瓶座｜ふっと距離をとる"
        text: "ひとりが好きに見えても\n離れるのはさみしさの裏返し。\n**変わらず接する**のがいちばん。"
      - label: "魚座｜ぼんやりが増える"
        text: "音楽や空想にひたる時間が\n増えたら、少し疲れているサイン。\n**話を聞くだけ**で心がほどけます。"

  - type: list
    eyebrow: "さみしいサインに気づいたら"
    heading: "さみしさに\nよりそう3つのこと"
    style: number
    items:
      - text: "理由を聞きすぎない"
        sub: "問いつめるより、そばにいることを"
      - text: "短いひと言を送る"
        sub: "「元気？」だけでも、心は温まります"
      - text: "自分のサインにもやさしく"
        sub: "さみしいのは、大切な人がいるから"

  - type: closing
