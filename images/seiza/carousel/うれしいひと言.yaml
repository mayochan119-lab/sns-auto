theme: rei
seed: 5
slides:
  - type: cover
    eyebrow: "12星座別"
    title: "言われると\nうれしいひと言"
    subtitle: "大切な人に届けたい言葉"
    art: wheel
    art_size: 340
    note: "あとで見返せるよう保存してください"

  - type: text
    eyebrow: "はじめに"
    heading: "同じ言葉でも\n届き方はちがう"
    body: "心に残るひと言は\n星座によって少しずつちがいます。\n\n11/14までは水星と金星が逆行中。\n言葉がすれ違いやすい今こそ\n**うれしいひと言**を\nていねいに届けてみてください。"

  - type: text
    icon: star
    eyebrow: "言われるとうれしいひと言"
    heading: "牡羊座・牡牛座"
    sections:
      - label: "牡羊座"
        text: "**「さすが、行動が早いね」**\n迷わず動いた勇気を\n認めてもらえると元気が出ます"
      - label: "牡牛座"
        text: "**「あなたといると落ち着く」**\nゆっくり育ててきた安心感が\n伝わっていたと実感できます"

  - type: text
    icon: star
    eyebrow: "言われるとうれしいひと言"
    heading: "双子座・蟹座"
    sections:
      - label: "双子座"
        text: "**「話してると時間を忘れる」**\n言葉のセンスや会話の楽しさを\nほめられると心がはずみます"
      - label: "蟹座"
        text: "**「気づいてくれてありがとう」**\n見えないところでの心配りが\n届いていたとわかると安心します"

  - type: text
    icon: star
    eyebrow: "言われるとうれしいひと言"
    heading: "獅子座・乙女座"
    sections:
      - label: "獅子座"
        text: "**「あなたがいると明るくなる」**\nその存在そのものを認められると\n自信がわいてきます"
      - label: "乙女座"
        text: "**「ていねいだね、助かったよ」**\n細かいところまでの努力に\n目を向けてもらえると報われます"

  - type: text
    icon: star
    eyebrow: "言われるとうれしいひと言"
    heading: "天秤座・蠍座"
    sections:
      - label: "天秤座"
        text: "**「センスがいいね」**\n服やお店を選ぶ美意識を\nほめられると笑顔になります"
      - label: "蠍座"
        text: "**「あなたにだけ話せる」**\n心から信頼されていると\n感じられる言葉がいちばん響きます"

  - type: text
    icon: star
    eyebrow: "言われるとうれしいひと言"
    heading: "射手座・山羊座"
    sections:
      - label: "射手座"
        text: "**「一緒にいると世界が広がる」**\n自由な考え方や行動力を\n楽しんでもらえるとうれしい"
      - label: "山羊座"
        text: "**「がんばってたの、見てたよ」**\n誰にも言わずに続けた努力を\n知っていてくれた人に心がほどけます"

  - type: text
    icon: star
    eyebrow: "言われるとうれしいひと言"
    heading: "水瓶座・魚座"
    sections:
      - label: "水瓶座"
        text: "**「その発想、おもしろいね」**\n人とちがう考え方を\n受け入れてもらえると心強い"
      - label: "魚座"
        text: "**「あなたのやさしさに救われた」**\n人の気持ちに寄り添う力を\n受け取ってもらえると満たされます"

  - type: closing
