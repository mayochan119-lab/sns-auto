theme: rei
seed: 7
slides:
  - type: cover
    eyebrow: "10/26 牡牛座の満月"
    title: "満月に\n手放すといいもの"
    subtitle: "ハンターズムーン｜12星座別"
    art: moon
    note: "あとで見返せるように保存してね"

  - type: text
    eyebrow: "今日 10/26 13:12"
    heading: "牡牛座の満月\nハンターズムーン"
    body: "満月は、ひとつの区切りのとき。\n牡牛座の満月は\n**心地よさ・お金・体**がテーマ。\n\n今はW逆行の最中なので\n手放して**整える**のに\nぴったりのタイミングです。"

  - type: text
    icon: sparkle
    eyebrow: "満月に手放すといいもの"
    heading: "牡羊座・牡牛座"
    sections:
      - label: "牡羊座｜くらべる焦り"
        text: "人とくらべて急ぐ気持ちを手放して。\n**今あるもの**を数えてみると\n心がふっと落ち着きます。"
      - label: "牡牛座｜がまんのしすぎ"
        text: "あなたの星座での満月です。\n続けてきた**がまんや遠慮**を\n手放して、好きを選んで大丈夫。"

  - type: text
    icon: sparkle
    eyebrow: "満月に手放すといいもの"
    heading: "双子座・蟹座"
    sections:
      - label: "双子座｜夜のぐるぐる"
        text: "寝る前の考えごとや\n**スマホの見すぎ**を手放して。\n早めに休むと頭が澄みます。"
      - label: "蟹座｜合わせすぎる関係"
        text: "無理に続けている付き合いを\nそっと手放すとき。\n**心が楽になる人**を大切に。"

  - type: text
    icon: sparkle
    eyebrow: "満月に手放すといいもの"
    heading: "獅子座・乙女座"
    sections:
      - label: "獅子座｜完璧でいること"
        text: "仕事や役割での\n**完璧でいなきゃ**を手放して。\n8割でも、十分がんばっています。"
      - label: "乙女座｜「こうあるべき」"
        text: "知らないうちに増えた\n**自分ルール**を手放すとき。\n新しい見方が楽しくなります。"

  - type: text
    icon: sparkle
    eyebrow: "満月に手放すといいもの"
    heading: "天秤座・蠍座"
    sections:
      - label: "天秤座｜期待しすぎ"
        text: "相手に期待しすぎる気持ちを\nそっと手放して。\n**自分で自分を満たす**のが近道です。"
      - label: "蠍座｜相手を試すこと"
        text: "気持ちを確かめたくなる\n**試すような言動**を手放して。\n素直なひと言がいちばん届きます。"

  - type: text
    icon: sparkle
    eyebrow: "満月に手放すといいもの"
    heading: "射手座・山羊座"
    sections:
      - label: "射手座｜詰めこみ予定"
        text: "予定の入れすぎや\n**休まない習慣**を手放して。\n余白があなたの力になります。"
      - label: "山羊座｜楽しむことへの遠慮"
        text: "「遊んでいる場合じゃない」を\n今日は手放して。\n**好きなこと**に時間を使ってみて。"

  - type: text
    icon: sparkle
    eyebrow: "満月に手放すといいもの"
    heading: "水瓶座・魚座"
    sections:
      - label: "水瓶座｜使っていないもの"
        text: "部屋にある使わないものを\n**ひとつだけ**手放してみて。\n家が軽くなると心も整います。"
      - label: "魚座｜飲みこんだ言葉"
        text: "言えずにためた気持ちを\n**紙に書いて**手放して。\n伝える言葉もやさしくなります。"

  - type: closing
