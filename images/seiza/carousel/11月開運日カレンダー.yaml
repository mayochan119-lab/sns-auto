theme: rei
seed: 5
slides:
  - type: cover
    eyebrow: "保存用"
    title: "11月の\n開運日カレンダー"
    subtitle: "日付ごとのおすすめ行動"
    art: wheel
    art_size: 300
    note: "あとで見返せるように保存してください"

  - type: list
    eyebrow: "ひと目でわかる"
    heading: "11月のカレンダー"
    style: dot
    items:
      - "11/4　一粒万倍日"
      - "11/7　立冬・一粒万倍日"
      - "11/8　一粒万倍日"
      - "11/9　蠍座の新月"
      - "11/14　W逆行が終わる"
      - "11/19・20　一粒万倍日"
      - "11/22　射手座シーズンへ"
      - "11/24　スーパームーン"

  - type: text
    eyebrow: "11月 上旬"
    heading: "一粒万倍日と立冬"
    sections:
      - label: "11/4（水）一粒万倍日"
        text: "不成就日とも重なる日。\n始めるより**準備や下調べ**に\n使うのがおすすめです"
      - label: "11/7（土）立冬・一粒万倍日"
        text: "18:52に立冬。冬の始まりに\n**新しい習慣**をひとつ\n始めてみてください"

  - type: text
    eyebrow: "11月 上旬"
    heading: "一粒万倍日から新月へ"
    sections:
      - label: "11/8（日）一粒万倍日"
        text: "前日に続く一粒万倍日。\n**小さな貯金や勉強**を\n始めるのにぴったりです"
      - label: "11/9（月）蠍座の新月"
        text: "16:02に蠍座の新月。\n本当に大切にしたい願いを\n**紙に書き出して**みてください"

  - type: text
    icon: star
    eyebrow: "11/14（土）"
    heading: "W逆行が終わる日"
    body: "0:54に水星が順行へ。\n金星もそろって順行に戻ります。\n\n止まっていた連絡や\n迷っていた買い物は\n**少しずつ動かしてOK**。\nあせらず、ゆっくりで大丈夫です。"

  - type: text
    eyebrow: "11月 中旬"
    heading: "2日続く一粒万倍日"
    sections:
      - label: "11/19（木）一粒万倍日"
        text: "W逆行が明けたあとの吉日。\n**温めていた計画**を\nスタートさせてみてください"
      - label: "11/20（金）一粒万倍日"
        text: "不成就日とも重なる日。\n新しく始めるより\n**前日の続きを育てる**日に"

  - type: text
    eyebrow: "11月 下旬"
    heading: "射手座シーズンと\nスーパームーン"
    sections:
      - label: "11/22（日）射手座シーズン開始"
        text: "16:23に太陽が射手座へ。\n小雪で、いい夫婦の日。\n大切な人に**ありがとう**を"
      - label: "11/24（火）双子座の満月"
        text: "23:54のスーパームーン。\n大きな月がのぼる夜は\n**がんばった自分をほめて**"

  - type: list
    eyebrow: "11月のおすすめ"
    heading: "開運日に\nやるといいこと3つ"
    style: number
    items:
      - text: "整える"
        sub: "一粒万倍日に、お財布や手帳を"
      - text: "書き出す"
        sub: "蠍座の新月に、本当の願いを"
      - text: "伝える"
        sub: "射手座シーズンに、感謝の言葉を"

  - type: closing
