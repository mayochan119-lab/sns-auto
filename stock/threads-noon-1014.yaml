# 昼の枠をやめたので使わなかった昼の下書き（あとで朝・夜に回せる）

- date: 2026-10-14
  seiza:
    threads_noon:  # R6
      text: |
        今日始めたことは、万倍になって返ってくる。
        10/14は一粒万倍日です。

        ただ、今は金星逆行中（11/14まで）。
        新しく足すより、止まっていたことを
        もう一度始めるほうが実りやすい時期。

        A　やめていた習慣を再開する
        B　言いそびれた「ありがとう」を伝える
        C　お気に入りの物を手入れする

        どれかひとつで十分。
        あなたはどれにする？
        #星座占い
      approved: false
  renai:
    threads_noon:  # L6
      text: |
        見ないって決めたのに、
        あの人のストーリーだけは開いちゃう。

        足あとが残るのが怖くて
        一回指が止まるのに、
        結局、見ちゃうんだよね。

        それだけ好きってことだよ💜

        同じ人いる？
        #恋愛占い
      approved: false

- date: 2026-10-15
  seiza:
    threads_noon:  # R5
      text: |
        LINEの返信、
        すぐ返す派？ 寝かせる派？

        すぐ返す派
        おひつじ座・ふたご座・しし座・いて座

        じっくり寝かせる派
        おうし座・かに座・さそり座・やぎ座

        文面を考えすぎて遅くなる派
        おとめ座・てんびん座・うお座

        既読のまま、うっかり忘れる派
        みずがめ座

        当たってた？
        #星座占い
      approved: false
  renai:
    threads_noon:  # L5
      text: |
        あの人の今の気持ち、
        直感で1つ選んで🌙

        1. 三日月
        2. 満月
        3. 流れ星

        ▼結果
        1. 素直になれないだけ。きっかけを探してる
        2. あなたを思い出す回数が増えてる
        3. 気持ちを整理中。追わないほど近づくよ

        何番だった？
        #恋愛占い
      approved: false

- date: 2026-10-16
  seiza:
    threads_noon:  # N2
      text: |
        タイミングさえ違えば、
        続いていたと思う恋、ありますか？
        #星座占い
      approved: false
  renai:
    threads_noon:  # L2
      text: |
        連絡してこない彼の本音、3つ。

        ① 何て送ればいいか、ずっと考えてる
        ② 今さら迷惑かもって、怖がってる
        ③ 本当は、あなたからの一言を待ってる

        どれも「冷めた」わけじゃないよ🌙

        あなたの彼は何番っぽい？
        #恋愛占い
      approved: false

- date: 2026-10-17
  seiza:
    threads_noon:  # R4
      text: |
        来週から、W逆行が始まります。

        10/24 16:13、水星が逆行入り。
        いま逆行中の金星と重なって、
        11/14まで、ふたつの逆行が続きます。

        見直し・再会・やり直しの季節。
        今のうちに準備しておこう。

        🔥火（おひつじ座・しし座・いて座）
        勢いで決めた約束を、一度見直して

        🌱地（おうし座・おとめ座・やぎ座）
        お金と契約まわりは、10/24までに確認を

        🌬風（ふたご座・てんびん座・みずがめ座）
        大事な連絡は、早めに送っておくと安心

        💧水（かに座・さそり座・うお座）
        過去の縁が動いても、まずは深呼吸

        あなたは何座？
        #星座占い
      approved: false
  renai:
    threads_noon:  # N2
      text: |
        あの人とのトーク、
        まだ消せずに残してる人、いますか？
        #恋愛占い
      approved: false

- date: 2026-10-18
  seiza:
    threads_noon:  # R5
      text: |
        好きな人には
        自分から連絡する派？
        来るまで待つ派？

        🔥火の星座（おひつじ座・しし座・いて座）
        待つほうがストレス。つい送っちゃう

        💧水の星座（かに座・さそり座・うお座）
        相手の様子を見てから、そっと動く

        あなたはどっち？
        #星座占い
      approved: false
  renai:
    threads_noon:  # L6
      text: |
        返事を待ってるあいだ、
        用もないのにトーク画面を開いちゃう。

        送った文を何度も読み返して、
        「重かったかな」ってひとり反省会。

        やっと通知が鳴ったと思ったら、
        ぜんぜん違う人。

        …これ、私だけじゃないよね？🌙

        #恋愛占い
      approved: false

- date: 2026-10-19
  seiza:
    threads_noon:  # R3
      text: |
        実は、元恋人をいちばん忘れられない星座TOP3

        1位　かに座
        思い出の場所を、今もそっと避けて通る。

        2位　さそり座
        平気なふりが上手なだけで、
        心の奥ではずっと覚えている。

        3位　おうし座
        一度大切にしたものを、簡単には手放せない。

        金星逆行中のいまは、なおさら。

        あなたの星座、入ってた？
        #星座占い
      approved: false
  renai:
    threads_noon:  # L5
      text: |
        あの人に一言だけ送れるなら、
        どれを選ぶ？

        ①「元気にしてる？」
        ②「会いたい」
        ③ 何も送らない

        ━━━━
        ①のあなた
        → 彼もきっかけを探してる時期。軽い一言が扉をひらきそう。

        ②のあなた
        → 気持ちが熟してるサイン。天秤座シーズンのうちに、少しだけ素直に。

        ③のあなた
        → 待てる強さがある人。今は自分を満たすことが、いちばんの近道。

        あなたは何番？✨

        #恋愛占い
      approved: false

- date: 2026-10-20
  seiza:
    threads_noon:  # R3
      text: |
        実は、いちばん一途な星座TOP3

        ①やぎ座
        一度決めた人とは、何年でも向き合う。

        ②かに座
        好きになったら、その人が帰る場所になりたい。

        ③みずがめ座
        意外かもしれないけど、浮気はいちばんしないタイプ。

        あなたの星座、入ってた？
        #星座占い
      approved: false
  renai:
    threads_noon:  # L2
      text: |
        既読のまま止まってる彼。
        本音はだいたい、この3つ。

        1. 返事を考えすぎて、送れなくなってる
        2. 余裕がなくて、誰とも話したくない時期
        3. あなたの反応がこわくて、様子を見てる

        どれも「どうでもいい」とは違うの。

        金星逆行中（11/14まで）は、
        気持ちが言葉になるまで時間がかかる時期。
        追いかけるより、待つほうが届くこともあるよ。

        あなたの彼は何番っぽい？

        #恋愛占い
      approved: false
