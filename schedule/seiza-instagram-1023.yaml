      caption: |
        W逆行中に起こりやすいこと｜エレメント別

        明日10/24の16時13分から、水星が逆行に入ります。
        金星は10/3から逆行中なので、11/14までは2つの星がそろって後ろ向きに進む「W逆行」の期間です。

        逆行と聞くと身構えてしまうかもしれませんが、こわい時期ではありません。
        立ち止まって、見直して、やり直すのに向いている時間です。

        今回は、火・地・風・水のエレメント別に、W逆行中に起こりやすいことと、おすすめの過ごし方をまとめました。
        自分の星座と、大切な人の星座のページまでスワイプしてみてください。

        あなたはどのエレメントでしたか？
        当てはまったところがあれば、コメントで教えてくださいね。

        11/14まで見返せるように、保存しておくのがおすすめです。

        自分の星座の流れをもっとくわしく知りたい方は、DMで「鑑定希望」とお送りください。

