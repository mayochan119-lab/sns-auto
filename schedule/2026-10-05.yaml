- date: 2026-10-06
  renai:
    threads_night:
      text: |
        眠れない夜に、恋の話を少しだけ🌙

        好きな人からの返信を待って、
        何度もスマホを見てしまう夜。

        でもね、返信の速さと気持ちの大きさは
        必ずしも比例しないんです。

        今夜は通知を切って、
        自分のために早く眠ってみて。
        明日のあなたのほうが、きっと素敵だから。
      approved: true

- date: 2026-10-07
  seiza:
    threads_morning:
      text: |
        🌙 10月7日(水) 今日の星座ランキング

        1位 てんびん座♎ 誰かのひと言が背中を押してくれる日
        2位 しし座♌ 思い切った行動が吉
        3位 うお座♓ ふと浮かんだアイデアを大切に
        4位 ふたご座♊ 久しぶりの連絡に良いご縁
        5位 おひつじ座♈ 朝いちばんのタスクを片付けて
        6位 いて座♐ 寄り道で小さな発見がありそう
        7位 みずがめ座♒ 聞き役にまわると運気アップ
        8位 かに座♋ 家でのんびり過ごす時間が◎
        9位 さそり座♏ 深呼吸してから返事をしよう
        10位 やぎ座♑ がんばりすぎず、7割で十分
        11位 おとめ座♍ 完璧を目指さなくて大丈夫
        12位 おうし座♉ 温かい飲み物がラッキーアイテム

        今日も素敵な一日になりますように✨
      approved: true
