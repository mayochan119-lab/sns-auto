- date: 2026-10-07
  seiza:
    threads_night:
      text: |
        🌙 今は天秤座の季節です

        9/23〜10/23ごろは、太陽が天秤座にいる時期。
        星座占いでは「人との関係」や「バランス」に目が向きやすい季節とされています。

        この時期におすすめなのは
        ・言いそびれていた「ありがとう」を伝える
        ・頑張りすぎている予定を1つ減らす
        ・身の回りを心地よく整える

        天秤座さん、お誕生日の季節おめでとうございます🎂

        #星座占い
      approved: false
  renai:
    threads_morning:
      text: |
        おはようございます🌙

        好きと言えないのは、あなたが本気だという証拠。

        今日は、その気持ちを大切に持ったまま
        自分のために一日を過ごしてね💜
      approved: false
