        🌙今週の恋の流れ（11/4〜11/10）

        今週の月は、11/9の蠍座の新月に向かって
        少しずつ細くなっていく途中。
        金星と水星の逆行も、11/14ごろまで続きます。

        占星術では、こんな傾向が出やすいと言われる時期です。

        ・決めるより、自分の気持ちを確かめるほうが向いている
        ・言い間違いや勘違いが起きやすいので、大事な話はゆっくりめに
        ・人との距離感を考え直したくなりやすい

