        「あの言い方でよかったかな」と巻き戻しがち
        →相手はもう次の話をしていることも多いです

        💧水（かに座・さそり座・うお座）
        「迷惑だったかな」と考えこみがち
        →気づかいができるから、出てくる言葉です

