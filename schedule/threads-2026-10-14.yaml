    threads_noon:  # L2
      text: |
        既読のまま止まってる彼。
        本音はだいたい、この3つ。

        1. 返事を考えすぎて、送れなくなってる
        2. 余裕がなくて、誰とも話したくない時期
        3. あなたの反応がこわくて、様子を見てる

        どれも「どうでもいい」とは違うの。

        金星逆行中（11/14まで）は、
        気持ちが言葉になるまで時間がかかる時期。
        追いかけるより、待つほうが届くこともあるよ。

        あなたの彼は何番っぽい？

        #恋愛占い
