      text: |
        昔の恋が戻ってきやすい3週間が、
        10/24から始まります。

        水星も逆行に入って、
        すでに逆行中の金星と重なる「W逆行」。
        11/14まで続きます。

        ・久しぶりの連絡
        ・終わったはずの話がもう一度
        ・思いがけない場所での再会

        もし来ても、すぐ答えを出さなくて大丈夫。
        本当に戻りたいのか、ゆっくり確かめてね🌙

        戻ってきてほしい人、いる？

