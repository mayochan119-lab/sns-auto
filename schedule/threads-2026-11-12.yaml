        ①てんびん座｜好きなペンを1本そばに置くと気分が整いそう
        ②さそり座　｜集中のスイッチが入りやすい日
        ③おうし座　｜お昼をゆっくり味わうと、午後が軽くなりそう
        ④ふたご座　｜友だちのひと言に笑わせてもらえそう
        ⑤おひつじ座｜午前中にエンジンがかかりやすい日
        ⑥しし座　　｜まわりをほめると、自分の気分まで上がりそう
        ⑦かに座　　｜部屋の明かりを少し落とすと、ほっとできそう
