        ⑨やぎ座　　｜「今日はここまで」を先に決めると楽に
        ⑩みずがめ座｜いつもと違う飲みものが気分転換に
        ⑪いて座　　｜カバンを軽くすると、身軽に動けそう
        ⑫おとめ座　｜やることは3つまでにしぼって

        自分の星座、何位にいた？

        #星座占い
      approved: true
    threads_night:  # R2
      text: |
        🌙星座別｜気づかれにくい、あなたのやさしさ

        おひつじ座｜言いにくいことを、先に言ってあげる
        おうし座　｜落ちこんでいる人のそばに、黙っていてあげる
        ふたご座　｜沈んだ空気を、話で笑いに変える
        かに座　　｜帰り際の「気をつけてね」を忘れない
        しし座　　｜人のうれしい話を、自分のことのように喜ぶ
        おとめ座　｜人のミスを責めずに、一緒に直す
        てんびん座｜みんなが話しやすいように、順番を整える
        さそり座　｜打ち明けられた話を、ずっと胸にしまっておく
        いて座　　｜元気のない人を、外の空気に連れ出す
        やぎ座　　｜大変な役回りを、何も言わずに引き受ける
        みずがめ座｜ひとりでいたい人を、そっとしておく
        うお座　　｜言葉にならない気持ちまで、くみ取る

        やさしさは、気づかれないところでいちばん働いています。
        今日もあなたは、誰かの一日を少し楽にしていたのかも。

        どの星座の人にも、自分の一行が見つかるように書いています。

        あなたのやさしさ、どれに近い？

