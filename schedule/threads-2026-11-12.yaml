      text: |
        🌙星座別｜人に言うほどじゃない、小さなこだわり

        おひつじ座｜エレベーターの「閉」は、自分で押したい
        おうし座　｜お気に入りのマグは、ほかの人に使わせない
        ふたご座　｜読みかけの本が、いつも3冊ある
        かに座　　｜家の鍵は、毎日同じ場所に置く
        しし座　　｜写真には、自分のいちばんいい角度がある
        おとめ座　｜タオルのたたみ方は、ゆずれない
        てんびん座｜服と小物の色を、どこかでそろえる
        さそり座　｜本当に好きなお店は、人に教えない
        いて座　　｜旅先では、その土地のものを食べる
        やぎ座　　｜待ち合わせには、10分前に着いておく
        みずがめ座｜みんなと同じものは、なるべく選ばない
        うお座　　｜寝る前に聴く曲は、毎晩同じ

        人から見れば、どうでもいいようなことでも、
        それがあると一日が少し整う。
        こだわりって、そういうものですよね。

        人の意外な一面がわかる「実は〇〇な星座」も、朝の投稿でときどき書いています。

        あなたにも、人に言うほどじゃないこだわりはある？

