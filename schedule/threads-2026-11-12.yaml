    threads_night:  # 週1の流れ
      text: |
        🌙今週の恋の流れ（11/18〜11/24）

        昨日の上弦の月から、満月へ。
        月が少しずつ丸くなっていく1週間です。

        11/22（日）の夕方、太陽が射手座へ。
        11/24（火）の夜遅く、双子座で満月。
        金星と水星の逆行も、先週明けたばかりです。

        占星術では、こんな傾向が出やすいと言われる時期です。

        ・逆行中に保留にしていたことを、確かめ直しやすい
        ・射手座シーズンは、気持ちが外に向きやすい
        ・双子座の満月は「言葉」がテーマになりやすい

        伝えるかどうかは、急いで決めなくて大丈夫。
        まずは自分のメモに、本音を書いてみるところから。

        今週、一行だけ書くなら、どんな言葉になりそう？

        #恋愛占い
      approved: true
