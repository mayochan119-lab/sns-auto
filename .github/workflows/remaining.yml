name: 予定の残りチェック

# 承認済みの投稿があと4日分を切ったら失敗にして、メールで知らせる
on:
  schedule:
    - cron: "17 3 * * *"  # 毎日（日本時間の昼ごろ。GitHubの都合で遅れることがあります）
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python post.py --remaining
