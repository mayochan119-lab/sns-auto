name: 予約投稿

on:
  schedule:
    # GitHub の予約実行は混雑すると遅れたり飛ばされたりするので、30分ごとに動かして
    # 時刻が過ぎた投稿をまとめて出す（ちょうど0分は混みやすいので7分・37分にする）
    - cron: "7,37 * * * *"
  workflow_dispatch:  # 手動実行ボタン
    inputs:
      now:
        description: "今すぐ投稿する投稿ID（カンマ区切り。空なら時刻が来たものだけ）"
        required: false
        default: ""
      prepare:
        description: "インスタを公開せずに準備だけ試す投稿ID（カンマ区切り）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: post  # 同時に2つ動いて二重投稿しないように
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # 最新の main（posted.json を含む）を取る。古い状態だと二重投稿になるため
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 投稿
        env:
          IG_ACCESS_TOKEN_SEIZA: ${{ secrets.IG_ACCESS_TOKEN_SEIZA }}
          THREADS_ACCESS_TOKEN_SEIZA: ${{ secrets.THREADS_ACCESS_TOKEN_SEIZA }}
          IG_ACCESS_TOKEN_RENAI: ${{ secrets.IG_ACCESS_TOKEN_RENAI }}
          THREADS_ACCESS_TOKEN_RENAI: ${{ secrets.THREADS_ACCESS_TOKEN_RENAI }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          NOW_IDS: ${{ inputs.now }}
          PREPARE_IDS: ${{ inputs.prepare }}
        run: |
          if [ -n "$PREPARE_IDS" ]; then
            python post.py --prepare "$PREPARE_IDS"
          else
            python post.py --now "$NOW_IDS"
          fi
      - name: 投稿済みの記録を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "投稿済みを記録"
          git pull --rebase && git push
