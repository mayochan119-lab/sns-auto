name: トークン更新

# アクセストークンは60日で切れるので、毎月1日と15日に自動で延長する
on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: IG_ACCESS_TOKEN_SEIZA, url: "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token"}
          - {name: IG_ACCESS_TOKEN_RENAI, url: "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token"}
          - {name: THREADS_ACCESS_TOKEN_SEIZA, url: "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token"}
          - {name: THREADS_ACCESS_TOKEN_RENAI, url: "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token"}
    steps:
      - name: ${{ matrix.name }}
        env:
          TOKEN: ${{ secrets[matrix.name] }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          # 貼り付けで入った空白・改行を取り除いてから送る
          TOKEN=$(printf %s "$TOKEN" | tr -d '[:space:]')
          # GH_PAT も、空白・改行や先頭の「Bearer」が入っていたら取り除く
          GH_TOKEN=$(printf %s "${GH_TOKEN:-}" | sed 's/^[[:space:]]*[Bb]earer[[:space:]]*//' | tr -d '[:space:]')
          export GH_TOKEN
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_PAT（金庫に入れる鍵）が設定されていないので、更新できません"
            exit 1
          fi
          new=$(curl -fsS -G "${{ matrix.url }}" --data-urlencode "access_token=$TOKEN" | jq -r .access_token)
          # 取得に失敗したら、今の鍵を消さずに止める
          if [ -z "$new" ] || [ "$new" = "null" ]; then
            echo "鍵の更新に失敗しました（今の鍵はそのまま残しています）"
            exit 1
          fi
          echo "::add-mask::$new"
          gh secret set "${{ matrix.name }}" --repo "$GITHUB_REPOSITORY" --body "$new"
